name: Publish workshop guides

on:
  push:
    paths:
      - '.upload-staging/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild guide files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/guides
          cat .upload-staging/zero-*.part | base64 --decode | gzip --decompress > docs/guides/zero-cve.html
          cat .upload-staging/pqc-*.part  | base64 --decode | gzip --decompress > docs/guides/pqc-additional.html
          echo '01cbdb6bf008511fd008c3dc76f829543694694086b6ce9647ce338cd7daaefc  docs/guides/zero-cve.html' | sha256sum --check
          echo 'd40b180dcd5a3911b6124e91d9e6c4fd6161997c9c02da1a48357830bb0adf51  docs/guides/pqc-additional.html' | sha256sum --check

      - name: Commit guides and remove staging data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .upload-staging
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/guides .upload-staging
          git commit -m '[skip ci] Publish workshop guides'
          git push
